<nav
  class="icon-sidebar"
  x-data="initSidebar()"
  :class="{
  'is-icon-sidebar-translated-mobile': $store.app.isSidebarOpenedMobile,
  '': !$store.app.isSidebarOpenedMobile
}"
>
  <div class="icon-sidebar-inner">
    <ul>
      <li class="main-logo">
        <a href="/">
          <img src="/img/logo/logo.svg" class="light-image-block" alt="" />
          <img src="/img/logo/logo.svg" class="dark-image-block" alt="" />
        </a>
      </li>
      <li
        class="side-icon"
        @click="openSidebar('dashboard')"
        :class="{
                'is-active': $store.app.activeSidebar == 'dashboard',
                '': !$store.app.activeSidebar != 'dashboard'
            }"
      >
        <div class="side-icon-inner mask mask-blob">
          <i class="iconify" data-icon="ph:grid-four-duotone"></i>
        </div>
      </li>
      <li
        class="side-icon"
        @click="openSidebar('documents')"
        :class="{
                'is-active': $store.app.activeSidebar == 'documents',
                '': !$store.app.activeSidebar != 'documents'
            }"
      >
        <div class="side-icon-inner mask mask-blob">
          <i class="iconify" data-icon="ph:note-duotone"></i>
        </div>
      </li>
      <li
        class="side-icon"
        @click="openSidebar('business')"
        :class="{
                'is-active': $store.app.activeSidebar == 'business',
                '': !$store.app.activeSidebar != 'business'
            }"
      >
        <div class="side-icon-inner mask mask-blob">
          <i class="iconify" data-icon="ph:briefcase-duotone"></i>
        </div>
      </li>
      <li
        class="side-icon"
        @click="openSidebar('misc')"
        :class="{
                'is-active': $store.app.activeSidebar == 'misc',
                '': !$store.app.activeSidebar != 'misc'
            }"
      >
        <div class="side-icon-inner mask mask-blob">
          <i class="iconify" data-icon="ph:chart-pie-slice-duotone"></i>
        </div>
      </li>
    </ul>

    <ul class="profile">
      <li>
        <!-- Profile avatar -->
        <a class="profile-trigger" href="javascript:" @click="toggleProfile()">
          <img
            class="icon-sidebar-avatar mask mask-blob"
            src="/img/avatars/55.jpg"
            alt=""
            :class="{
                      'vanish': $store.app.isProfileOpen,
                      '': !$store.app.isProfileOpen
                  }"
          />
          <span
            class="dot"
            :class="{
                  'vanish': $store.app.isProfileOpen,
                  '': !$store.app.isProfileOpen
              }"
          ></span>
        </a>

        <!-- Profile avatar -->
      </li>
    </ul>
  </div>
</nav>
